# Gera o APK quando se cria uma tag v* (Fase 7, tarefa 7.3)
name: Android APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: pip install -r requirements.txt flet-cli==1.1.2
      - name: Gerar secrets.json (só a chave pública)
        run: python scripts/gerar_secrets.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Gerar o APK
        run: flet build apk --yes -v
      - uses: actions/upload-artifact@v4
        with:
          name: eventos-coimbra-apk
          path: build/apk
      - name: Juntar o APK à Release (só em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
          generate_release_notes: true
