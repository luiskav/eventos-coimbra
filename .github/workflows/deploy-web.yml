# Publica o site em cada merge no main (Fase 6, tarefa 6.4)
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt flet-cli==1.1.2
      - name: Gerar secrets.json (só a chave pública)
        run: python scripts/gerar_secrets.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Gerar o site
        run: >
          flet publish src/main.py
          --assets src/assets
          --distpath "${{ github.workspace }}/dist"
          --app-name "My Own City"
          --app-short-name "My Own City"
          --app-description "Tudo o que acontece em Coimbra, num só sítio"
          --pwa-theme-color "#0A0A0A"
          --pwa-background-color "#0A0A0A"
      - name: Ecrã de carregamento animado (bloco G)
        run: python scripts/splash.py dist/index.html
      - name: Confirmar que o site foi gerado
        run: ls -la dist && test -f dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
