# Recolha diária de eventos (Fase 2, tarefa 2.9)
name: Scraper
on:
  schedule:
    - cron: "47 4 * * *"   # todos os dias às 07:47 UTC
  workflow_dispatch:        # botão "Run workflow" para correr à mão
    inputs:
      fonte:
        description: "id de uma só fonte (vazio = todas as ativas)"
        required: false
        default: ""
concurrency:
  group: scraper
jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scraper/requirements.txt
      - name: Recolher eventos
        run: |
          if [ -n "$FONTE" ]; then
            python -m scraper.run --fonte "$FONTE"
          else
            python -m scraper.run
          fi
        env:
          FONTE: ${{ github.event.inputs.fonte }}   # via env, nunca colado no script
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
