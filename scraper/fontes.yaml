# Fontes do scraper (Fase 2, tarefa 2.1).
# Escolhidas a partir dos 129 eventos que a tarefa agendada "Eventos Coimbra
# diários" encontrou (out. 2026). O scraper verifica o robots.txt antes de cada visita.
# Antes de ativar uma fonte, lê os termos de utilização do site.
# "seletor" (opcional) = seletor CSS da zona da agenda, para mandar menos texto ao Claude.

cidade: Coimbra

fontes:
  # Agenda conjunta da Câmara e da Universidade: a fonte com mais eventos (~50%).
  # Só a página inicial serve: as páginas /explore carregam os eventos por JavaScript.
  - id: agenda-coimbra
    nome: Agenda Coimbra (Câmara e Universidade)
    url: https://agenda.coimbra.pt/
    categoria: outro
    seletor: ""
    ativa: true

  - id: convento
    nome: Convento São Francisco
    url: https://www.coimbraconvento.pt/pt/agenda/
    categoria: outro
    seletor: ""
    ativa: true

  - id: tagv
    nome: Teatro Académico de Gil Vicente
    url: https://tagv.pt/agenda/
    categoria: teatro
    seletor: ""
    ativa: true

  - id: jazz-ao-centro
    nome: Jazz ao Centro Clube / Salão Brazil
    url: https://www.jazzaocentroclube.pt/agenda
    categoria: musica
    seletor: ""
    ativa: true

  - id: teatrao
    nome: O Teatrão
    url: http://oteatrao.com/programacao/
    categoria: teatro
    seletor: ""
    ativa: false

  # Ativadas em 27/11/2026: as primeiras fontes estão estáveis e os repetidos
  # entre fontes já são detetados (scraper/repetidos.py).
  - id: fbb
    nome: Fundação Bissaya Barreto (Casa das Artes)
    url: https://agenda.fbb.pt/eventos/
    categoria: exposicao
    seletor: ""
    ativa: true

  - id: capc
    nome: Círculo de Artes Plásticas de Coimbra
    url: https://capcoimbra.org/
    categoria: exposicao
    seletor: ""
    ativa: true

  - id: marionet
    nome: Marionet
    url: https://marioneteatro.com/activities
    categoria: teatro
    seletor: ""
    ativa: true

  # Agregador: só mostra 1 a 2 dias e repete eventos das fontes acima.
  # Usar só se faltar alguma sala; confirmar primeiro os termos do site.
  - id: viral-agenda
    nome: Viral Agenda (Coimbra)
    url: https://www.viralagenda.com/pt/coimbra/coimbra
    categoria: outro
    seletor: ""
    ativa: false

  # --- Novas fontes (27/11/2026) -------------------------------------------
  # Fnac, Worten, Ticketline, BOL, Blueticket, Fever e Bandsintown não têm uma
  # página de Coimbra que se leia sem JavaScript (ou só revendem bilhetes de
  # outras bilheteiras): ficam a cargo da tarefa agendada do Claude, que as
  # pesquisa todos os dias (fonte "tarefa-claude").

  # Concertos em Coimbra (inclui Sala 8, Lit, NB Club, Fnac, Rugby Lounge...).
  # A página também mostra cidades próximas: o Claude só guarda as de Coimbra.
  - id: songkick
    nome: Songkick (concertos em Coimbra)
    url: https://www.songkick.com/pt/metro-areas/31799-portugal-coimbra
    categoria: musica
    seletor: ""
    ativa: true

  # Teatro da Cerca de São Bernardo / A Escola da Noite: o site próprio não
  # tem agenda fácil de ler; a página da sala no Viral Agenda tem a programação.
  - id: tcsb
    nome: Teatro da Cerca de São Bernardo (via Viral Agenda)
    url: https://www.viralagenda.com/pt/p/TCSBernardo
    categoria: teatro
    seletor: ""
    ativa: true

  # Fnac Fórum Coimbra: concertos, comedy nights, apresentações de livros.
  - id: fnac-coimbra
    nome: Fnac Fórum Coimbra (via Viral Agenda)
    url: https://www.viralagenda.com/pt/p/304632222938971
    categoria: musica
    seletor: ""
    ativa: true

  # Introdução manual: uma Google Sheet onde se escrevem eventos à mão.
  # Sem Claude e sem custo. Ver docs/MANUAL.md.
  # A folha tem de estar partilhada como "Qualquer pessoa com o link: Leitor".
  # "link_padrao" é usado quando a linha não tem Link.
  - id: manual
    nome: Introdução manual
    tipo: folha
    url: https://docs.google.com/spreadsheets/d/19jRPJjfjkHduoVCPQP4XPBnvuv-S3db8GUsUM8Q_Dto/edit#gid=0
    link_padrao: https://myowncity.net/
    categoria: outro
    ativa: true

  # Folha da tarefa agendada do Claude "Eventos Coimbra diários (Sheet + Supabase)".
  # Mesma leitura da folha manual; os repetidos de outras fontes só completam o que existe.
  # Partilhada como "Qualquer pessoa com o link: Leitor".
  - id: tarefa-claude
    nome: Tarefa Claude (Eventos Coimbra)
    tipo: folha
    url: https://docs.google.com/spreadsheets/d/1ucBVK7mQd9A1wc9C-e_Il1FmILY53lvqRdebtbL-W_U/edit#gid=0
    link_padrao: https://myowncity.net/
    categoria: outro
    ativa: true
